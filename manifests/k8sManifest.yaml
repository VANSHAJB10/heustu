apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanshaj-greeting
  labels:
    app: vanshaj-greeting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vanshaj-greeting
  template:
    metadata:
      labels:
        app: vanshaj-greeting
    spec:
      containers:
        - name: vanshaj-greeting
          image: vanshajb10/hey-vanshaj:1
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: vanshaj-greeting-service
spec:
  selector:
    app: vanshaj-greeting
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
