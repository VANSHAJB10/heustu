pipeline:
  name: cd-deploy-pipelines
  identifier: cddeploypipelines
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_connector_for_whole_account
        repoName: heustu
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: DeployUsingK8s
        identifier: DeployUsingK8s
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: ServiceManifest
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
            gitBranch: main
          environment:
            environmentRef: heustupreprod
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: keustuK8sInfra
          execution:
            steps:
              - stepGroup:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  steps:
                    - step:
                        type: K8sRollout
                        name: K8sRollout
                        identifier: K8sRollout
                        spec:
                          command: pause
                          resources:
                            type: ReleaseName
                        timeout: 2m
              - stepGroup:
                  name: Primary Deployment
                  identifier: primaryDeployment
                  steps:
                    - step:
                        name: Rolling Deployment
                        identifier: rollingDeployment
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
                          pruningEnabled: false
              - step:
                  type: Email
                  name: Email for Success
                  identifier: Email_for_Success
                  spec:
                    to: vanshajbajaj1002@gmail.com
                    cc: ""
                    subject: "Deploy Pipeline "
                    body: "The CD-Deploy Pipeline has been successful "
                  timeout: 10m
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
